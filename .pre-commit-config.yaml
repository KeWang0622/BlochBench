# pre-commit hooks: pip install pre-commit && pre-commit install
# Task code under families/ is frozen with SHA-256 manifests and is never reformatted.
exclude: ^families/
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff
        files: ^(mragentbench|tools|tests|infra)/
      - id: ruff-format
        files: ^(mragentbench|tools|tests|infra)/
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
        args: [--unsafe]  # CloudFormation templates use tags such as !Ref
      - id: check-json
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
      - id: detect-private-key
